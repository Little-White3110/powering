name: Release

# 三种触发方式：
#   1. push tag vX.Y.Z    → 自动打包并创建 GitHub Release（推版本号即发布）
#   2. workflow_dispatch  → 在 Actions 页面手填版本号发版；tag 不存在时自动补建并推送
#   3. pull_request       → 只构建 + 跑单测做校验，不发版
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'HolePowerRing/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.2.3 或 v1.2.3（可带 -beta.1 预发布后缀）'
        required: true
        type: string
      draft:
        description: '创建为草稿 Release（不公开通知）'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 同一 ref 的重复触发排队执行，避免两个版本同时抢同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1) 解析版本号：tag / 手动输入 → versionName + versionCode
  # ------------------------------------------------------------------
  resolve:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.resolve.outputs.version_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: 解析
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="${INPUT_VERSION:-}"
          elif [[ "$REF_NAME" == v* ]]; then
            RAW="$REF_NAME"
          else
            # PR / 普通分支推送：只做构建校验，沿用工程默认版本号（输出留空）
            {
              echo "version_name="
              echo "version_code="
              echo "tag="
              echo "prerelease=false"
              echo "should_release=false"
              echo "is_release=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式非法：$RAW（应为 vX.Y.Z 或 vX.Y.Z-beta.1）"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          SUFFIX="${BASH_REMATCH[4]:-}"

          # versionCode = major*1000000 + minor*1000 + patch：单调递增且肉眼可读
          # （10# 前缀避免 Bash 把 08/09 当八进制）
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::versionCode 超出 Android 上限：$VERSION_CODE"
            exit 1
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
          TAG="v${VERSION_NAME}"

          PRERELEASE=false
          # 带预发布后缀的版本默认按预发布处理
          if [ -n "$SUFFIX" ] || [ "${INPUT_PRERELEASE:-}" = "true" ]; then PRERELEASE=true; fi

          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "should_release=true"
            echo "is_release=true"
          } >> "$GITHUB_OUTPUT"

          echo "版本 ${VERSION_NAME} → versionCode=${VERSION_CODE}，tag=${TAG}，预发布=${PRERELEASE}"

  # ------------------------------------------------------------------
  # 2) 单测 + 构建 release APK
  # ------------------------------------------------------------------
  build:
    name: 构建 APK
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 密钥以 Secret 传入，不入库。缺任一项时 Gradle 侧自动回落 debug 签名，
      # 产物仍可安装，但不能作为正式发布包（构建日志会给出 warning）。
      - name: 还原发布密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "已还原发布密钥，将使用正式签名"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次产物使用 debug 签名（仅供测试）"
          fi

      - name: 单元测试
        working-directory: HolePowerRing
        run: ./gradlew test --stacktrace

      - name: 构建 release APK
        working-directory: HolePowerRing
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace \
            -PversionName="${{ needs.resolve.outputs.version_name }}" \
            -PversionCode="${{ needs.resolve.outputs.version_code }}"

      - name: 重命名产物
        if: needs.resolve.outputs.is_release == 'true'
        run: |
          cp HolePowerRing/app/build/outputs/apk/release/app-release.apk \
             "HolePowerRing-${{ needs.resolve.outputs.tag }}.apk"

      - name: 上传产物（发版）
        if: needs.resolve.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HolePowerRing-${{ needs.resolve.outputs.tag }}
          path: HolePowerRing-${{ needs.resolve.outputs.tag }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传产物（PR 校验）
        if: needs.resolve.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HolePowerRing-pr-${{ github.event.pull_request.number }}
          path: HolePowerRing/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # 3) 发布 GitHub Release（仅 tag / 手动触发）
  # ------------------------------------------------------------------
  release:
    name: 发布 Release
    needs: [resolve, build]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 手动发版时 tag 可能还不存在，补建并推上去，保证 Release 挂在真实 tag 上
      - name: 手动触发时补建 tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，跳过创建"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "已在 $GITHUB_SHA 上创建并推送 tag $TAG"
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: HolePowerRing-${{ needs.resolve.outputs.tag }}
          path: dist

      - name: 生成校验和
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail

          # 注意：不能用 `[ ... ] && FLAG=...`，条件为假时整条语句返回非 0，
          # 在 set -e 下会直接中断脚本
          DRAFT_FLAG=""
          if [ "${DRAFT:-}" = "true" ]; then DRAFT_FLAG="--draft"; fi
          PRERELEASE_FLAG=""
          if [ "${PRERELEASE:-}" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi

          # 变更日志按「上一个 tag → 当前 tag」自动生成
          NOTES_FLAGS="--generate-notes"
          PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAGS="--generate-notes --notes-start-tag $PREV_TAG"
            echo "变更日志基准：$PREV_TAG"
          else
            echo "没有找到上一个 tag，生成全量变更日志"
          fi

          # 同一 tag 重复跑（重试、手动重跑）不新建 Release，改为覆盖资产
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖其中的资产"
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            exit 0
          fi

          # shellcheck disable=SC2086
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "$TAG" \
            $NOTES_FLAGS \
            $DRAFT_FLAG \
            $PRERELEASE_FLAG